<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR AI Assistant</title>
<style>
  body{font-family:Arial,sans-serif;max-width:820px;margin:20px auto;padding:0 12px;background:#f5f6fa;color:#222}
  h1{font-size:22px}
  h2{font-size:16px;margin:0 0 8px}
  .card{background:#fff;border-radius:8px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .badge{display:inline-block;background:#6c47ff;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
  input,select,button,textarea{font-size:14px;padding:8px;border-radius:6px;border:1px solid #bbb}
  button{background:#0d9488;color:#fff;border:none;cursor:pointer}
  button:disabled{opacity:.5}
  #log{height:240px;overflow:auto;border:1px solid #ddd;border-radius:6px;padding:8px;background:#fafafa;margin-bottom:8px}
  .me{text-align:right;margin:6px 0}
  .me span{background:#d1fae5;padding:6px 10px;border-radius:8px;display:inline-block}
  .bot{margin:6px 0}
  .bot span{background:#ede9fe;padding:6px 10px;border-radius:8px;display:inline-block}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .row input[type=text],.row textarea{flex:1;min-width:200px}
  .err{color:#b91c1c}
  .ok{color:#047857}
  .muted{color:#666;font-size:13px}
  ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<h1>HR AI Assistant <span class="badge">AI-generated answers</span></h1>

<div class="card">
  <h2>Signed in as</h2>
  <select id="userSel"></select>
  <span class="muted" id="whoami"></span>
</div>

<div class="card">
  <h2>Ask the assistant</h2>
  <div id="log"></div>
  <div class="row">
    <input type="text" id="msg" placeholder="e.g. How many sick leaves do I have left this year?">
    <button id="sendBtn">Send</button>
  </div>
  <div class="muted">Answers come from the database through tools. Labelled AI-generated.</div>
</div>

<div class="card" id="summaryCard">
  <h2>Dashboard summary (HR / Admin)</h2>
  <button id="sumBtn">Summarize</button>
  <div id="sumOut"></div>
</div>

<div class="card" id="leaveCard">
  <h2>Smart leave</h2>
  <div class="row">
    <textarea id="leaveText" rows="2" placeholder="e.g. I need next Monday and Tuesday off for my sister's wedding"></textarea>
    <button id="leaveBtn">Fill the form</button>
  </div>
  <div id="leaveMsg"></div>
  <div id="leaveForm" style="display:none">
    <div class="row">
      <select id="lType">
        <option>sick</option><option>casual</option><option>annual</option><option>unpaid</option>
      </select>
      <input type="date" id="lStart">
      <input type="date" id="lEnd">
      <input type="text" id="lReason" placeholder="Reason">
    </div>
    <button id="confirmBtn">Confirm leave request</button>
    <span class="badge">AI pre-filled</span>
  </div>
</div>

<script>
let uid = null;
const $ = id => document.getElementById(id);

async function api(path, opts) {
  opts = opts || {};
  opts.headers = {"Content-Type": "application/json", "X-User-Id": String(uid)};
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.detail) || ("Error " + r.status));
  return data;
}

function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function setUser(id) {
  uid = id;
  $("log").innerHTML = "";
  $("sumOut").textContent = "";
  $("leaveMsg").textContent = "";
  $("leaveForm").style.display = "none";
  const opt = $("userSel").selectedOptions[0];
  const isHr = opt && /hr|admin/i.test(opt.dataset.role || "");
  $("summaryCard").style.display = isHr ? "block" : "none";
  $("leaveCard").style.display = isHr ? "none" : "block";
  $("whoami").textContent = opt ? " role: " + opt.dataset.role : "";
}

async function loadUsers() {
  const r = await fetch("/users");
  const users = await r.json();
  const sel = $("userSel");
  users.forEach(u => {
    const o = document.createElement("option");
    o.value = u.id;
    o.dataset.role = u.role;
    o.textContent = u.name + " (" + u.role + (u.department ? ", " + u.department : "") + ")";
    sel.appendChild(o);
  });
  sel.onchange = () => setUser(Number(sel.value));
  setUser(Number(sel.value));
}

async function send() {
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  addMsg("me", text);
  $("sendBtn").disabled = true;
  try {
    const d = await api("/ai/chat", {method: "POST", body: JSON.stringify({message: text})});
    addMsg("bot", d.answer + "  [" + d.label + "]");
  } catch (e) {
    addMsg("bot", "Error: " + e.message);
  }
  $("sendBtn").disabled = false;
}

async function summarize() {
  const out = $("sumOut");
  out.textContent = "Thinking...";
  try {
    const d = await api("/ai/summary", {method: "POST"});
    out.innerHTML = "";
    if (!d.ok) { out.textContent = d.message; return; }
    const ul = document.createElement("ul");
    d.bullets.forEach(b => {
      const li = document.createElement("li");
      li.textContent = b;
      ul.appendChild(li);
    });
    out.appendChild(ul);
    const tag = document.createElement("span");
    tag.className = "badge";
    tag.textContent = d.label;
    out.appendChild(tag);
  } catch (e) {
    out.innerHTML = "";
    const p = document.createElement("div");
    p.className = "err";
    p.textContent = "Error: " + e.message;
    out.appendChild(p);
  }
}

function showForm(p) {
  $("lType").value = p.type || "casual";
  $("lStart").value = p.start || "";
  $("lEnd").value = p.end || "";
  $("lReason").value = p.reason || "";
  $("leaveForm").style.display = "block";
}

async function smartLeave() {
  const text = $("leaveText").value.trim();
  if (!text) return;
  const m = $("leaveMsg");
  m.className = "muted";
  m.textContent = "Thinking...";
  try {
    const d = await api("/ai/smart-leave", {method: "POST", body: JSON.stringify({text: text})});
    if (d.ok) {
      m.className = "ok";
      m.textContent = d.note + " [" + d.label + "]";
      showForm(d.prefill);
    } else {
      m.className = "err";
      m.textContent = d.message;
      showForm({});
    }
  } catch (e) {
    m.className = "err";
    m.textContent = "Error: " + e.message + " Please fill the form manually.";
    showForm({});
  }
}

function confirmLeave() {
  const m = $("leaveMsg");
  m.className = "ok";
  m.textContent = "Confirmed by you: " + $("lType").value + " leave, " + $("lStart").value + " to " + $("lEnd").value + ". (The AI never saves. Saving belongs to the Leave module.)";
  $("leaveForm").style.display = "none";
}

$("sendBtn").onclick = send;
$("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("sumBtn").onclick = summarize;
$("leaveBtn").onclick = smartLeave;
$("confirmBtn").onclick = confirmLeave;
loadUsers();
</script>
</body>
</html>
